<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circuit Lab — Nodal & Mesh</title><style>
:root{--ink:#152c3a;--muted:#647680;--paper:#f4f5ef;--green:#176b54;--line:#d9dfd7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui,sans-serif}header{padding:20px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fff}b.logo{font-size:20px;letter-spacing:-1px}.logo span{color:var(--green)}button,a,input,select{font:inherit}button,a.tab{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);padding:11px 18px;border-radius:8px;text-decoration:none}button:hover,a.tab:hover{border-color:var(--green)}button.primary,.tab.active{background:var(--green);color:white;border-color:var(--green)}main{max-width:1250px;margin:auto;padding:44px 26px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:700}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-2px;margin:10px 0}p{line-height:1.65} .lead{color:var(--muted);max-width:780px}nav{display:flex;gap:10px;margin:26px 0}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:25px;margin-bottom:22px}.card h2{font-size:19px;margin:0 0 15px}.tag{font-size:12px;background:#e8f3ed;color:var(--green);padding:5px 9px;border-radius:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.circuit{background:#f8faf7;border-radius:12px;margin:18px 0;overflow:hidden}svg{width:100%;height:auto;display:block}svg text{font:15px system-ui;fill:var(--ink)}svg .wire{fill:none;stroke:#284c50;stroke-width:2.5}svg .node{fill:var(--green)}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-size:13px;color:var(--muted)}input,select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);padding:10px;border-radius:7px;background:#fff;color:var(--ink)}input:focus{outline:2px solid #7db6a0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.answer{background:#edf5ef;padding:18px;border-radius:10px}.answer small{display:block;color:var(--muted)}.answer strong{display:block;font-size:27px;margin-top:7px}.steps{counter-reset:step}.step{position:relative;padding:0 0 20px 40px;line-height:1.65}.step:before{counter-increment:step;content:counter(step);position:absolute;left:0;background:#e8f3ed;border-radius:50%;width:26px;height:26px;text-align:center;color:var(--green);font-weight:700}.eq{font:14px ui-monospace,monospace;background:#f4f6f2;padding:12px;border-radius:7px;margin-top:9px;overflow:auto}.note{font-size:14px;color:var(--muted)}#feedback{min-height:46px;margin-top:15px;line-height:1.6}footer{font-size:12px;color:var(--muted);padding:15px 0}details{margin-top:15px}summary{cursor:pointer;color:var(--green)}@media(max-width:850px){.grid{grid-template-columns:1fr}main{padding:28px 16px}.fields{grid-template-columns:repeat(2,1fr)}}@media print{header,nav,button,.practice{display:none}.grid{display:block}.card{break-inside:avoid}}
</style><header><b class="logo">◉ circuit<span>lab</span></b><div><span class="tag">DC · KCL · KVL</span> <button id="lang" aria-label="Change language">English ↗</button></div></header><main><div class="eyebrow">CIRCUIT LAB / <span id="chapter"></span></div><h1 id="title"></h1><p class="lead" id="intro"></p><nav><a class="tab" href="#nodal" id="navN"></a><a class="tab" href="#mesh" id="navM"></a></nav><div class="grid"><section><div class="card"><div class="row"><h2 id="circuitTitle"></h2><span class="tag" id="badge"></span></div><div class="circuit" id="drawing"></div><p class="note" id="convention"></p><div class="fields" id="fields"></div><p class="note" id="validation" role="status"></p></div><div class="card"><div class="row"><h2 id="resultsTitle"></h2><button id="solution"></button></div><div class="answers" id="answers"></div><div id="worked" hidden><div class="steps" id="steps"></div><p class="note" id="check"></p></div></div></section><aside><div class="card"><span class="eyebrow" id="methodLabel"></span><h2 id="methodTitle" style="margin-top:12px"></h2><p id="method"></p><details><summary id="specialTitle"></summary><p class="note" id="special"></p></details></div><div class="card practice"><span class="eyebrow" id="practiceLabel"></span><h2 id="practiceTitle" style="margin-top:12px"></h2><p id="question"></p><label id="inputLabel" for="attempt"></label><input type="number" step="any" id="attempt"><div style="display:flex;gap:8px;margin-top:16px"><button class="primary" id="verify"></button><button id="new"></button></div><div id="feedback" role="status" aria-live="polite"></div><p class="note" id="progress"></p></div><div class="card"><h2 id="tipTitle"></h2><p class="note" id="tip"></p><button id="print"></button></div></aside></div><footer id="footer"></footer></main><script>
let lang=localStorage.getItem('circuit-language')||'es',mode=location.hash==='#mesh'?'mesh':'nodal',show=false,solved=new Set(),problem=0;let values={r1:4,r2:6,r3:3,s1:mode==='nodal'?2:12,s2:mode==='nodal'?1:6};
const copy={es:{n:'Análisis nodal',m:'Análisis de mallas',intro:'Del circuito a las ecuaciones. Explora los valores, sigue el procedimiento y comprueba tu respuesta a tu propio ritmo.',ct:'Un circuito, paso a paso',live:'Valores editables',res:'Resultados calculados',show:'Mostrar procedimiento',hide:'Ocultar procedimiento',ml:'LA IDEA CLAVE',mt:'Elige tu referencia',nm:'Asigna tierra y expresa cada corriente como una diferencia de potencial dividida entre la resistencia. Aplica LCK en cada nodo desconocido.',mm:'Asigna una corriente horaria a cada malla. Aplica LVK y expresa la caída en la resistencia compartida usando la diferencia de corrientes.',st:'¿Y los casos especiales?',ns:'Una fuente de voltaje entre dos nodos desconocidos forma un supernodo: aplica LCK al contorno y agrega la ecuación de la fuente. Una fuente conectada a tierra fija directamente el voltaje de ese nodo.',ms:'Una fuente de corriente compartida por dos mallas forma una supermalla: aplica LVK al contorno exterior y agrega la relación de corrientes impuesta por la fuente. Una fuente en una sola malla fija esa corriente.',pl:'PRÁCTICA SIN LÍMITE',pt:'Ahora te toca',verify:'Comprobar',next:'Nuevo ejercicio',tiptitle:'Cuida los signos',nt:'Un voltaje negativo indica que el nodo está por debajo de la referencia. Para una resistencia entre nodos, la corriente de 1 a 2 es (V₁ − V₂)/R₃.',mtip:'Una corriente negativa circula en sentido opuesto a la flecha elegida. En R₃, la corriente hacia abajo es I₁ − I₂; no es la suma.',print:'Imprimir / guardar PDF',foot:'Laboratorio de circuitos de corriente directa · Resistencias en Ω, fuentes en A o V · Intentos ilimitados',nc:'La línea inferior es tierra (0 V). Ambas fuentes de corriente apuntan hacia arriba e inyectan corriente a los nodos.',mc:'I₁ e I₂ se definen en sentido horario. Ambas fuentes tienen + arriba. En R₃, I₁ baja e I₂ sube.',invalid:'Usa resistencias positivas y valores finitos. Las fuentes pueden ser negativas.',qN:'Calcula V₁ para el circuito mostrado. Ingresa tu respuesta en V.',qM:'Calcula I₁ para el circuito mostrado. Ingresa tu respuesta en A.',answer:'Tu respuesta',good:'¡Correcto! El signo y la magnitud son consistentes con las ecuaciones.',bad:'Revisa los signos y la resistencia compartida. Puedes abrir el procedimiento y volver a intentar.',empty:'Ingresa un número antes de comprobar.',progress:'Ejercicios resueltos en esta sesión: ',tol:'Se acepta un error de 1% (mínimo 0.01).',step1N:'Elige tierra y nombra los nodos V₁ y V₂.',step2N:'Aplica LCK: la suma de las corrientes que salen por resistencias es igual a la corriente inyectada.',step3:'Resuelve el sistema de dos ecuaciones.',step1M:'Define I₁ e I₂ en sentido horario.',step2M:'Aplica LVK. En la rama compartida, resta la otra corriente.',balance:'Comprobación: ',power:'potencia suministrada = potencia disipada',branch:'Corriente en R₃, de 1 a 2: ',shared:'Corriente hacia abajo en R₃: '},en:{n:'Nodal analysis',m:'Mesh analysis',intro:'From circuit to equations. Explore the values, follow the method, and check your answer at your own pace.',ct:'One circuit, step by step',live:'Editable values',res:'Calculated results',show:'Show solution',hide:'Hide solution',ml:'THE KEY IDEA',mt:'Choose your reference',nm:'Assign ground and express each current as a voltage difference divided by resistance. Apply KCL at each unknown node.',mm:'Assign a clockwise current to each mesh. Apply KVL and express the voltage drop across the shared resistor using the difference of mesh currents.',st:'What about special cases?',ns:'A voltage source between two unknown nodes creates a supernode: apply KCL around its boundary and add the source voltage equation. A voltage source connected to ground directly sets that node voltage.',ms:'A current source shared by two meshes creates a supermesh: apply KVL around the outer boundary and add the current constraint imposed by the source. A source in only one mesh directly sets that mesh current.',pl:'UNLIMITED PRACTICE',pt:'Your turn',verify:'Check answer',next:'New exercise',tiptitle:'Watch the signs',nt:'A negative voltage means the node is below the reference potential. Through a resistor between nodes, the current from 1 to 2 is (V₁ − V₂)/R₃.',mtip:'A negative current flows opposite to the chosen arrow. Through R₃, the downward current is I₁ − I₂, not their sum.',print:'Print / save PDF',foot:'DC circuit laboratory · Resistances in Ω, sources in A or V · Unlimited attempts',nc:'The bottom wire is ground (0 V). Both current sources point upward and inject current into the nodes.',mc:'I₁ and I₂ are clockwise. Both voltage sources have + at the top. In R₃, I₁ flows down and I₂ flows up.',invalid:'Use positive resistances and finite values. Sources may be negative.',qN:'Calculate V₁ for the circuit shown. Enter your answer in V.',qM:'Calculate I₁ for the circuit shown. Enter your answer in A.',answer:'Your answer',good:'Correct! Your sign and magnitude agree with the equations.',bad:'Check your signs and the shared resistor. You can reveal the solution and try again.',empty:'Enter a number before checking.',progress:'Exercises solved this session: ',tol:'Accepted error: 1% (minimum 0.01).',step1N:'Choose ground and label the nodes V₁ and V₂.',step2N:'Apply KCL: total current leaving through resistors equals injected current.',step3:'Solve the two simultaneous equations.',step1M:'Define clockwise mesh currents I₁ and I₂.',step2M:'Apply KVL. Subtract the other mesh current in the shared branch.',balance:'Check: ',power:'power supplied = power dissipated',branch:'Current in R₃, from 1 to 2: ',shared:'Downward current in R₃: '}};
const $=id=>document.getElementById(id),f=x=>Number(x.toPrecision(4)).toString();function calc(){let {r1,r2,r3,s1,s2}=values;let a,b,c,d;if(mode==='nodal'){a=1/r1+1/r3;b=-1/r3;c=1/r2+1/r3;d=a*c-b*b;}else{a=r1+r3;b=-r3;c=r2+r3;d=a*c-b*b;}return [(s1*c-b*s2)/d,(a*s2-b*s1)/d]}
function resistor(x,y,vertical=false){return `<g transform="translate(${x} ${y}) ${vertical?'rotate(90)':''}"><path class="wire" d="M-40 0h12l4 -9 8 18 8 -18 8 18 8 -18 8 18 4 -9h12"/></g>`}
function draw(){let v=values,n=mode==='nodal';let svg=`<svg viewBox="0 0 600 310" role="img" aria-label="${copy[lang][n?'n':'m']}"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#176b54"/></marker></defs>`;if(n){svg+=`<path class="wire" d="M65 143V65H535V143M65 187V255H535V187M200 65V120M200 200V255M400 65V120M400 200V255"/><path stroke="#f8faf7" stroke-width="8" d="M260 65H340"/>${resistor(300,65)}${resistor(200,160,true)}${resistor(400,160,true)}<circle class="wire" cx="65" cy="165" r="22"/><circle class="wire" cx="535" cy="165" r="22"/><path class="wire" marker-end="url(#arr)" d="M65 178V151M535 178V151"/><text x="90" y="174">J₁ = ${v.s1} A</text><text x="440" y="211">J₂ = ${v.s2} A</text><text x="212" y="164">R₁ = ${v.r1} Ω</text><text x="290" y="44">R₃ = ${v.r3} Ω</text><text x="412" y="135">R₂ = ${v.r2} Ω</text><text x="178" y="45">V₁</text><text x="395" y="45">V₂</text><circle class="node" cx="200" cy="65" r="5"/><circle class="node" cx="400" cy="65" r="5"/>`;}else{svg+=`<path class="wire" d="M65 143V65H150M230 65H370M450 65H535V143M65 187V255H535V187M300 65V120M300 200V255"/>${resistor(190,65)}${resistor(410,65)}${resistor(300,160,true)}<circle class="wire" cx="65" cy="165" r="22"/><circle class="wire" cx="535" cy="165" r="22"/><text x="59" y="161">+</text><text x="60" y="181">−</text><text x="529" y="161">+</text><text x="530" y="181">−</text><text x="19" y="215">E₁=${v.s1} V</text><text x="467" y="215">E₂=${v.s2} V</text><text x="150" y="42">R₁=${v.r1} Ω</text><text x="370" y="42">R₂=${v.r2} Ω</text><text x="310" y="166">R₃=${v.r3} Ω</text><path d="M140 190 A43 43 0 1 1 215 190" fill="none" stroke="#176b54" stroke-width="2" marker-end="url(#arr)"/><path d="M375 190 A43 43 0 1 1 450 190" fill="none" stroke="#176b54" stroke-width="2" marker-end="url(#arr)"/><text x="165" y="169">I₁</text><text x="400" y="169">I₂</text>`;}svg+=`<path class="wire" d="M300 255v16m-15 0h30m-23 7h16m-12 7h8"/></svg>`;$('drawing').innerHTML=svg;}
function results(){let t=copy[lang],n=mode==='nodal',[x,y]=calc(),v=values;let labels=n?['V₁','V₂']:['I₁','I₂'],unit=n?'V':'A';$('answers').innerHTML=labels.map((l,i)=>`<div class="answer"><small>${l}</small><strong>${f([x,y][i])} <span style="font-size:16px">${unit}</span></strong></div>`).join('');let eq=n?`V₁/${v.r1} + (V₁ − V₂)/${v.r3} = ${v.s1}<br>V₂/${v.r2} + (V₂ − V₁)/${v.r3} = ${v.s2}`:`${v.r1}I₁ + ${v.r3}(I₁ − I₂) = ${v.s1}<br>${v.r2}I₂ + ${v.r3}(I₂ − I₁) = ${-v.s2}`;
// The right clockwise loop crosses E2 from + to −, so its RHS is −E2.
$('steps').innerHTML=`<div class="step">${t[n?'step1N':'step1M']}</div><div class="step">${t[n?'step2N':'step2M']}<div class="eq">${eq}</div></div><div class="step">${t.step3}<div class="eq">${labels[0]} = ${f(x)} ${unit}<br>${labels[1]} = ${f(y)} ${unit}</div></div>`;let branch=n?(x-y)/v.r3:x-y;let p=n?x*x/v.r1+y*y/v.r2+(x-y)**2/v.r3:x*x*v.r1+y*y*v.r2+(x-y)**2*v.r3;$('check').textContent=(n?t.branch:t.shared)+f(branch)+' A. '+t.balance+t.power+' = '+f(p)+' W.';draw();}
// Override for the explicitly drawn source polarities.
const originalCalc=calc;calc=function(){if(mode==='nodal')return originalCalc();let {r1,r2,r3,s1,s2}=values,a=r1+r3,c=r2+r3,d=a*c-r3*r3;return [(s1*c-r3*s2)/d,(r3*s1-a*s2)/d]};
function render(){let t=copy[lang],n=mode==='nodal';document.documentElement.lang=lang;document.title=t[n?'n':'m']+' · Circuit Lab';$('lang').textContent=lang==='es'?'English ↗':'Español ↗';$('chapter').textContent=n?'01 / NODAL':'02 / MESH';for(let [id,key] of Object.entries({title:n?'n':'m',intro:'intro',navN:'n',navM:'m',circuitTitle:'ct',badge:'live',resultsTitle:'res',methodLabel:'ml',methodTitle:'mt',method:n?'nm':'mm',specialTitle:'st',special:n?'ns':'ms',practiceLabel:'pl',practiceTitle:'pt',question:n?'qN':'qM',inputLabel:'answer',verify:'verify',new:'next',tipTitle:'tiptitle',tip:n?'nt':'mtip',print:'print',footer:'foot',convention:n?'nc':'mc'}))$(id).textContent=t[key];$('navN').classList.toggle('active',n);$('navM').classList.toggle('active',!n);$('solution').textContent=t[show?'hide':'show'];$('worked').hidden=!show;$('fields').innerHTML=Object.entries(values).map(([k,v],i)=>`<label>${i<3?'R'+['₁','₂','₃'][i]+' (Ω)':(n?'J':'E')+['₁','₂'][i-3]+(n?' (A)':' (V)')}<input type="number" step="any" ${i<3?'min="0.001"':''} data-k="${k}" value="${v}"></label>`).join('');document.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{let z=Number(el.value);if(el.value===''||!Number.isFinite(z)||(el.dataset.k[0]==='r'&&z<=0)){$('validation').textContent=t.invalid;return;}values[el.dataset.k]=z;problem++;$('validation').textContent='';$('feedback').textContent='';$('attempt').value='';results()});$('progress').textContent=t.progress+solved.size+'. '+t.tol;results()}
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';localStorage.setItem('circuit-language',lang);$('feedback').textContent='';render()};$('solution').onclick=()=>{show=!show;render()};window.onhashchange=()=>{mode=location.hash==='#mesh'?'mesh':'nodal';values={r1:4,r2:6,r3:3,s1:mode==='nodal'?2:12,s2:mode==='nodal'?1:6};show=false;problem++;$('attempt').value='';$('feedback').textContent='';render()};$('verify').onclick=()=>{let t=copy[lang],raw=$('attempt').value;if(!raw.trim()||!Number.isFinite(Number(raw))){$('feedback').textContent=t.empty;return}let target=calc()[0],ok=Math.abs(Number(raw)-target)<=Math.max(.01,Math.abs(target)*.01);$('feedback').textContent=t[ok?'good':'bad'];$('feedback').style.color=ok?'#176b54':'#9b4f24';if(ok)solved.add(mode+problem);$('progress').textContent=t.progress+solved.size+'. '+t.tol};$('new').onclick=()=>{let rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));values={r1:rand(2,12),r2:rand(2,12),r3:rand(2,10),s1:rand(1,mode==='nodal'?5:24),s2:rand(1,mode==='nodal'?5:18)};problem++;show=false;$('attempt').value='';$('feedback').textContent='';render()};$('print').onclick=()=>{show=true;render();window.print()};render();
</script></html>
